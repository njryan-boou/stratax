name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    name: Linux - GCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pybind11-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
  
  linux-clang:
    name: Linux - Clang
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pybind11-dev clang

      - name: Configure
        run: CC=clang CXX=clang++ cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    name: Windows - MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pybind11
        run: python -m pip install pybind11

      - name: Configure
        shell: pwsh
        run: |
          $pybind11Dir = python -m pybind11 --cmakedir
          cmake -S . -B build "-Dpybind11_DIR=$pybind11Dir"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure