name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    name: Linux - GCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pybind11-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
  
  linux-clang:
    name: Linux - Clang
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pybind11-dev clang

      - name: Configure
        run: CC=clang CXX=clang++ cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    name: Windows - MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pybind11
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11

      - name: Verify Python environment
        run: |
          python --version
          python -m pybind11 --cmakedir

      - name: Configure
        shell: pwsh
        run: |
          $pythonExe = python -c "import sys; print(sys.executable)"
          $pybind11Dir = python -m pybind11 --cmakedir
          cmake -S . -B build `
            "-DPython_EXECUTABLE=$pythonExe" `
            "-Dpybind11_DIR=$pybind11Dir"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  macos-apple-clang:
    name: macOS - Apple Clang
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ninja pybind11

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Stratax
        run: python -m pip install .

      - name: Test import
        run: python -c "import stratax; print(stratax)"