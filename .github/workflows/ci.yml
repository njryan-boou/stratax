name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    name: Release safeguards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: python -m pip install packaging

      - name: Test release safeguards
        run: python -m unittest discover -s tests/automation -p 'test_*.py'

      - name: Verify source release versions
        run: python scripts/check-release-version.py

  linux-gcc:
    name: Linux - GCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DSTRATAX_BUILD_TESTS=ON -Dpybind11_DIR=$(python -m pybind11 --cmakedir)

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Compile every public header independently
        run: python scripts/check-headers.py --compiler g++

      - name: Compile and run C++ documentation examples
        run: python scripts/check-doc-examples.py --cpp --compiler g++

  linux-clang:
    name: Linux - Clang
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 ninja
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Configure
        run: >-
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja
          -DSTRATAX_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Compile every public header independently
        run: python scripts/check-headers.py --compiler clang++

  windows-msvc:
    name: Windows - MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pybind11
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 ninja

      - name: Verify Python environment
        run: |
          python --version
          python -m pybind11 --cmakedir

      - name: Configure
        shell: pwsh
        run: |
          $pythonExe = python -c "import sys; print(sys.executable)"
          $pybind11Dir = python -m pybind11 --cmakedir
          cmake -S . -B build `
            "-DPython_EXECUTABLE=$pythonExe" `
            "-Dpybind11_DIR=$pybind11Dir" `
            "-DSTRATAX_BUILD_TESTS=ON"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Compile every public header independently
        run: python scripts/check-headers.py

  macos-apple-clang:
    name: macOS - Apple Clang
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DSTRATAX_BUILD_TESTS=ON -Dpybind11_DIR=$(python -m pybind11 --cmakedir)

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Compile every public header independently
        run: python scripts/check-headers.py

  python:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        architecture: [x64]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          - os: windows-latest
            architecture: x86
            python-version: "3.10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Install Stratax
        run: python -m pip install ".[dev]"

      - name: Test installed Python package
        run: python -I scripts/check-installed-package.py

      - name: Run Python documentation examples
        run: python scripts/check-doc-examples.py --python --installed

  coverage:
    name: C++ branch coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install coverage reporter
        run: python -m pip install gcovr==8.6

      - name: Build, test, and report coverage
        run: python scripts/check-coverage.py

      - name: Upload line and branch reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-coverage
          path: build/coverage/
          if-no-files-found: warn

  sdist:
    name: Source distribution build and installed tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Build and test from the source archive
        run: python scripts/check-sdist.py dist/*.tar.gz
