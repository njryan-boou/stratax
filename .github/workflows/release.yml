name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  preflight:
    name: Check release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: python -m pip install packaging

      - name: Test release safeguards
        run: python -m unittest discover -s tests/automation -p 'test_*.py'

      - name: Verify source versions and release tag
        id: version
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          python scripts/check-release-version.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

  build-wheels:
    name: Build wheels - ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=3,<4"

      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Verify wheel versions and contents
        run: python scripts/check-release-artifacts.py --version "${{ env.RELEASE_VERSION }}" "wheelhouse/*.whl"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: preflight
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Verify source archive version and contents
        run: python scripts/check-release-artifacts.py --version "$RELEASE_VERSION" "dist/*.tar.gz"

      - name: Build and test from the source archive
        run: python scripts/check-sdist.py dist/*.tar.gz

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-artifacts:
    name: Verify release artifacts
    needs:
      - preflight
      - build-wheels
      - build-sdist
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata checks
        run: python -m pip install twine

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Verify all archive versions and contents
        run: python scripts/check-release-artifacts.py --version "$RELEASE_VERSION" "dist/*"

      - name: Check package metadata and rendered description
        run: python -m twine check --strict dist/*

  publish:
    name: Publish to PyPI
    needs: verify-artifacts

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
